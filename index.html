
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Don't Let Them In</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse, #301313, #090909 70%);
      color: #f5eeee;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      width: min(440px, 92%);
      padding: 36px 24px;
      background: #151111;
      border: 1px solid #633030;
      border-radius: 12px;
      box-shadow: 0 0 45px #000;
    }
    h1 { color: #ef5555; font-size: 2.4rem; }
    p { color: #c5baba; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 1rem;
    }
    input {
      background: #090909;
      color: white;
      border: 1px solid #604444;
      text-align: center;
      text-transform: uppercase;
    }
    button {
      background: #a52a2a;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #c43b3b; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { min-height: 24px; font-size: .9rem; }
    .note { font-size: .8rem; color: #9c8d8d; }
  </style>
</head>
<body>
  <main>
    <h1>DON'T LET THEM IN</h1>
    <p>Trust no one. Check the doors. Survive together.</p>

    <button id="create">CREATE PRIVATE ROOM</button>

    <p>— OR JOIN YOUR FRIENDS —</p>
    <input id="code" maxlength="6"
      placeholder="ENTER ROOM CODE" autocomplete="off">
    <button id="join">JOIN ROOM</button>

    <p id="status">Multiplayer lobby setup in progress.</p>
    <p class="note">Private rooms · Up to 4 players</p>
  </main>

  <script>
    document.getElementById('create').onclick = () => {
      document.getElementById('status').textContent =
        'Room creation will be enabled in the next setup step.';
    };

    document.getElementById('join').onclick = () => {
      const code = document.getElementById('code').value
        .trim().toUpperCase();

      document.getElementById('status').textContent =
        /^[A-Z0-9]{6}$/.test(code)
          ? 'Room connection will be enabled in the next setup step.'
          : 'Enter a valid 6-character room code.';
    };
  </script>
</body>
</html>
