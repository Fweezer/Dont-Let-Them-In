
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Let Them In — Lobby</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#101010;color:#f4f4f4;font:16px/1.45 Arial,sans-serif}
main{width:min(100%,520px);padding:28px;background:#1b1b1b;border:1px solid #383838;border-radius:16px}
h1{margin:0 0 8px;font-size:clamp(1.6rem,6vw,2.2rem)}
p{color:#c8c8c8}
label{display:block;margin:16px 0 6px}
input,button{width:100%;border-radius:9px;padding:12px 14px;font:inherit}
input{border:1px solid #555;background:#111;color:white}
button{border:0;background:#b52626;color:white;font-weight:700;cursor:pointer;margin-top:12px}
button.secondary{background:#333;border:1px solid #555}
button:disabled{opacity:.45;cursor:not-allowed}
.divider{border:0;border-top:1px solid #383838;margin:22px 0}
.status{min-height:26px;color:#f1c36d;overflow-wrap:anywhere}
.code{font-size:1.5rem;letter-spacing:.2em;font-weight:800}
.players{list-style:none;padding:0;margin:10px 0}
.players li{background:#282828;border-radius:8px;padding:10px 12px;margin-top:7px}
.small{font-size:.9rem;color:#aaa}
</style>
</head>
<body>
<main>
<h1>DON'T LET THEM IN</h1>
<p>Private room lobby</p>

<section id="setup">
<button id="createBtn">Create room</button>
<hr class="divider">
<label for="roomInput">Join with a 6-character room code</label>
<input id="roomInput" maxlength="6" autocomplete="off"
       autocapitalize="characters" placeholder="ABC123">
<button id="joinBtn" class="secondary">Join room</button>
<p class="small">Public relays help browsers find each other. The connection is peer-to-peer.</p>
</section>

<section id="lobby" hidden>
<p>Your room code</p>
<div class="code" id="roomCode">------</div>
<button id="copyBtn" class="secondary">Copy room code</button>
<p class="status" id="status">Connecting to public relays…</p>
<p><strong>Players (<span id="count">1</span>/4)</strong></p>
<ul class="players" id="players"></ul>
<button id="startBtn" disabled>Start game (host only)</button>
<button id="leaveBtn" class="secondary">Leave room</button>
<p class="small">The player limit is checked by each browser, not enforced by a central server.</p>
</section>
</main>

<script type="module">
import { joinRoom } from "https://esm.sh/trystero";

const APP_ID = "gamesbysef-dont-let-them-in-lobby-v1";
const GAME_FILE = "Don%E2%80%99t%20Let%20Them%20In.html";
const $ = selector => document.querySelector(selector);

let room = null;
let sendPresence = null;
let sendStart = null;
let isHost = false;
let code = "";
let peers = new Map();
let started = false;

const myId = "P-" + Math.random().toString(36).slice(2, 7).toUpperCase();

function makeCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length: 6}, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
}

function setStatus(message) {
  $("#status").textContent = message;
}

function drawPlayers() {
  const list = [
    {name: myId + " (you)"},
    ...Array.from(peers.values()).map(player => ({
      name: player.name + (player.host ? " — host" : "")
    }))
  ];

  $("#count").textContent = String(list.length);
  $("#players").replaceChildren();

  list.forEach(player => {
    const li = document.createElement("li");
    li.textContent = player.name;
    $("#players").appendChild(li);
  });

  $("#startBtn").disabled = !isHost || list.length > 4 || started;

  if (list.length > 4) {
    setStatus("Too many players. Maximum: 4.");
  }
}

function launchGame() {
  if (started) return;
  started = true;
  location.href = GAME_FILE + "?room=" + encodeURIComponent(code);
}

async function enterRoom(roomCode, host) {
  code = roomCode;
  isHost = host;
  peers = new Map();
  started = false;

  $("#setup").hidden = true;
  $("#lobby").hidden = false;
  $("#roomCode").textContent = code;
  setStatus("Connecting to public relays…");

  try {
    room = joinRoom({appId: APP_ID, password: code}, code);

    const presence = room.makeAction("lobby-presence");
    const gameStart = room.makeAction("lobby-start");

    sendPresence = presence.send;
    sendStart = gameStart.send;

    presence.onMessage = (data, meta) => {
      if (!data || !meta?.peerId) return;

      if (data.type === "hello") {
        if (peers.size >= 3 && !peers.has(meta.peerId)) {
          setStatus("Room is full (4 players maximum).");
          return;
        }

        peers.set(meta.peerId, {
          name: String(data.name || "Player").slice(0, 20),
          host: !!data.host
        });

        drawPlayers();
        sendPresence(
          {type: "hello", name: myId, host: isHost},
          {target: meta.peerId}
        );
      }

      if (data.type === "leave") {
        peers.delete(meta.peerId);
        drawPlayers();
      }
    };

    gameStart.onMessage = data => {
      if (data?.type === "start" && !isHost) launchGame();
    };

    room.onPeerJoin = peerId => {
      if (peers.size >= 3 && !peers.has(peerId)) {
        setStatus("Room is full (4 players maximum).");
        return;
      }

      sendPresence(
        {type: "hello", name: myId, host: isHost},
        {target: peerId}
      );
      setStatus("Connected to a player.");
    };

    room.onPeerLeave = peerId => {
      peers.delete(peerId);
      drawPlayers();
      setStatus("A player left the room.");
    };

    drawPlayers();
    sendPresence({type: "hello", name: myId, host: isHost});

    setTimeout(() => {
      if (!started) {
        setStatus(
          peers.size
            ? "Lobby ready."
            : "Waiting for players… Check the room code and WebRTC connection."
        );
      }
    }, 3000);

  } catch (error) {
    console.error(error);
    setStatus("Could not join the room. Refresh and try again.");
  }
}

$("#createBtn").addEventListener("click", () => {
  enterRoom(makeCode(), true);
});

$("#joinBtn").addEventListener("click", () => {
  const value = $("#roomInput").value.trim().toUpperCase();

  if (!/^[A-HJ-NP-Z2-9]{6}$/.test(value)) {
    alert("Enter a valid 6-character room code.");
    return;
  }

  enterRoom(value, false);
});

$("#roomInput").addEventListener("input", () => {
  $("#roomInput").value = $("#roomInput").value
    .toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, "").slice(0, 6);
});

$("#copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(code);
    setStatus("Room code copied.");
  } catch {
    setStatus("Room code: " + code + " — copy it manually.");
  }
});

$("#startBtn").addEventListener("click", () => {
  if (!isHost || started || peers.size > 3) return;
  sendStart?.({type: "start"});
  launchGame();
});

$("#leaveBtn").addEventListener("click", async () => {
  try {
    sendPresence?.({type: "leave"});
    await room?.leave();
  } catch {}

  room = null;
  peers.clear();
  $("#setup").hidden = false;
  $("#lobby").hidden = true;
  isHost = false;
  started = false;
});

window.addEventListener("beforeunload", () => {
  try { room?.leave(); } catch {}
});
</script>
</body>
</html>
